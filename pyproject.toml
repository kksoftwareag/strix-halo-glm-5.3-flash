[project]
name = "glm53-flash"
version = "0.1.0"
description = "GLM-5.3-Flash mit llama.cpp auf AMD Strix Halo: Engines, Presets, Speicherwächter, Benchmarks, Dokumentation"
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glm53"]

[tool.pytest.ini_options]
testpaths = ["tests"]
